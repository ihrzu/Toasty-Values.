<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Item Values</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #55ff55; /* Minecraft Green */
        }
        #search {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .item-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .item-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-name {
            font-weight: bold;
            font-size: 18px;
        }
        .item-price {
            color: #ffaa00; /* Gold */
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Minecraft Server Economy</h1>
    <input type="text" id="search" placeholder="Search for an item..." onkeyup="filterItems()">
    
    <div class="item-list" id="itemList">
        </div>
</div>

<script>
    let itemsData = [];

    // Fetch data from prices.json
    fetch('prices.json')
        .then(response => response.json())
        .then(data => {
            itemsData = data;
            displayItems(itemsData);
        });

    function displayItems(items) {
        const list = document.getElementById('itemList');
        list.innerHTML = '';
        items.forEach(item => {
            list.innerHTML += `
                <div class="item-card">
                    <span class="item-name">${item.name}</span>
                    <span class="item-price">$${item.price.toLocaleString()}</span>
                </div>
            `;
        });
    }

    function filterItems() {
        const query = document.getElementById('search').value.toLowerCase();
        const filtered = itemsData.filter(item => item.name.toLowerCase().includes(query));
        displayItems(filtered);
    }
</script>

</body>
</html>
